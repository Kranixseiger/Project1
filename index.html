<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101329" />
  <title>Hello, World!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden;
      color: #f7f7ff; background: #101329;
      background-image: radial-gradient(ellipse at 17% 20%, #6448c844 0, transparent 38%), radial-gradient(ellipse at 83% 78%, #00c9c044 0, transparent 35%), linear-gradient(135deg,#101329,#171b38 55%,#101329);
    }
    .glow { position: fixed; width: 32rem; height: 32rem; border-radius: 50%; filter: blur(90px); opacity: .22; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }
    .glow.one { top: -15rem; left: -10rem; background: #a37bff; }
    .glow.two { right: -13rem; bottom: -18rem; background: #35e7d2; animation-delay: -5s; }
    main { position: relative; width: min(720px, calc(100% - 36px)); padding: clamp(38px, 8vw, 76px); text-align: center; border: 1px solid #ffffff22; border-radius: 30px; background: linear-gradient(145deg, #ffffff12, #ffffff06); box-shadow: 0 30px 100px #05071380, inset 0 1px #ffffff1c; backdrop-filter: blur(18px); animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .badge { display: inline-flex; align-items: center; gap: 9px; padding: 9px 14px; border: 1px solid #ffffff20; border-radius: 999px; color: #c9c8e8; background: #ffffff09; font-size: .76rem; font-weight: 650; letter-spacing: .12em; text-transform: uppercase; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #55e7c4; box-shadow: 0 0 14px #55e7c4; }
    h1 { margin: 27px 0 16px; font-size: clamp(3.2rem, 10vw, 6.4rem); line-height: .98; letter-spacing: -.075em; font-weight: 780; }
    h1 span { color: transparent; background: linear-gradient(100deg,#b5a0ff 8%,#f4a9e8 52%,#72e9d6 95%); background-clip: text; -webkit-background-clip: text; }
    p { max-width: 440px; margin: 0 auto; color: #b9bad3; font-size: clamp(1rem, 2.6vw, 1.16rem); line-height: 1.75; }
    .rule { width: 52px; height: 3px; margin: 31px auto 25px; border-radius: 9px; background: linear-gradient(90deg,#a98bff,#5de4d0); }
    .footer { color: #777b9f; font-size: .82rem; letter-spacing: .04em; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes drift { to { transform: translate(45px, 35px) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="glow one" aria-hidden="true"></div>
  <div class="glow two" aria-hidden="true"></div>
  <main>
    <div class="badge"><span class="dot" aria-hidden="true"></span> A little something to begin</div>
    <h1>Hello,<br /><span>World!</span></h1>
    <p>Every great idea starts somewhere. Here’s to the first line, the next big thing, and everything in between.</p>
    <div class="rule" aria-hidden="true"></div>
    <div class="footer">Made with curiosity ✦</div>
  </main>
</body>
</html>
